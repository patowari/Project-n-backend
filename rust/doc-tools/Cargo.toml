[package]
name = "pn-doc-tools"
version = "0.1.0"
edition = "2021"
description = "Sandboxed document text extraction for Project N AI review (untrusted DOCX in, bounded text out)"
license = "MIT"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
