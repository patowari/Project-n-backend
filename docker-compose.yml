# Local development and a realistic single-host production-like stack.
#   docker compose up --build          # postgres + redis + migrate + api + worker
#   docker compose --profile tools run --rm seed
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: projectn
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "log_min_duration_statement=500"]
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d projectn"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  # Applies migrations as the OWNER role, then sets the runtime role passwords. Runs to completion.
  migrate:
    build: .
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_MIGRATION_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/projectn
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-password-change-me-1234}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:-system-password-change-me-1234}
    command: ["sh", "-c", "npx prisma migrate deploy && node scripts/db-setup.cjs"]
    restart: "no"

  api:
    build: .
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://projectn_app:${APP_DB_PASSWORD:-app-password-change-me-1234}@postgres:5432/projectn
      DATABASE_SYSTEM_URL: postgresql://projectn_system:${SYSTEM_DB_PASSWORD:-system-password-change-me-1234}@postgres:5432/projectn
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "false"
    ports: ["8000:8000"]

  # Independently deployable and horizontally scalable: `docker compose up --scale worker=3`
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://projectn_app:${APP_DB_PASSWORD:-app-password-change-me-1234}@postgres:5432/projectn
      DATABASE_SYSTEM_URL: postgresql://projectn_system:${SYSTEM_DB_PASSWORD:-system-password-change-me-1234}@postgres:5432/projectn
      REDIS_URL: redis://redis:6379

  # docker compose --profile tools run --rm seed
  seed:
    build: .
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_SYSTEM_URL: postgresql://projectn_system:${SYSTEM_DB_PASSWORD:-system-password-change-me-1234}@postgres:5432/projectn
      SEED_ALLOW: "yes"
    command: ["node", "dist/seed.js"]

volumes:
  pgdata:
